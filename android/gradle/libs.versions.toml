[versions]
androidGradlePlugin = "8.5.2"
kotlin = "1.9.24"
androidxCore = "1.13.1"
androidxAppcompat = "1.7.0"
androidxActivity = "1.9.2"
androidxWebkit = "1.11.0"
youtubedlAndroid = "0.18.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
youtubedl-library = { module = "io.github.junkfood02.youtubedl-android:library", version.ref = "youtubedlAndroid" }
youtubedl-ffmpeg = { module = "io.github.junkfood02.youtubedl-android:ffmpeg", version.ref = "youtubedlAndroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
